name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      # This replaces the ./configure command that failed
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      # This compiles your code
      run: cmake --build ${{github.workspace}}/build --config Release

    - name: Test Execution
      # This verifies the app starts (it will likely fail on 'file not found' 
      # for data.txt, but it proves the code compiled!)
      run: |
        cd build
        ./Task06 << 'EOF'
        0
        EOF
